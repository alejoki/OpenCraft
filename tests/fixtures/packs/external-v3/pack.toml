format_version = 3
name = "External Stoneworks"
description = "Fixture authored from docs/TEXTURE-PACKS.md alone"

# Plant-style block: crossed quads, crisp cutout holes.
[[blocks]]
id = "external:reed"
name = "Reed"
textures = { all = "textures/reed.png" }
hardness = 0.2
model = "cross"
alpha = "cutout"

# Crop-style block: rendered like a cross with a hard-edged cutout mask.
[[blocks]]
id = "external:wheat"
name = "Field Wheat"
textures = { all = "textures/wheat_crop.png" }
hardness = 0.4
model = "crop"
alpha = "cutout"

# Translucent solid: cube geometry that reaches the blend draw path.
[[blocks]]
id = "external:frosted_glass"
name = "Frosted Glass"
textures = { all = "textures/frosted_glass.png" }
hardness = 0.3
model = "cube"
alpha = "blend"

# Presentation-only override of the documented built-in `apple` sprite.
[builtin_icons]
apple = "icons/apple.png"
