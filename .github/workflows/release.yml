name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Read and guard the crate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [[ -z "$version" ]]; then
            echo "release: no version found in Cargo.toml" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" && "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "release: tag $GITHUB_REF_NAME does not match crate version $version" >&2
            exit 1
          fi
          echo "release: version=$version ref=$GITHUB_REF_TYPE/$GITHUB_REF_NAME"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.triple }})
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            archive: zip
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TRIPLE: ${{ matrix.triple }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux audio build dependencies
        if: runner.os == 'Linux'
        run: bash scripts/install_linux_build_deps.sh

      - name: Cache cargo registry, git and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo test
        run: cargo test --locked

      - name: cargo build --release
        run: cargo build --release --locked

      - name: Package release archive
        run: bash scripts/package_release.sh "$VERSION" "$TRIPLE"

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: opencraft-${{ matrix.triple }}
          path: dist/opencraft-${{ needs.version.outputs.version }}-${{ matrix.triple }}.${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: publish
    needs: [version, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Download packaged artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: opencraft-*
          path: dist
          merge-multiple: true

      - name: Verify downloaded artifacts
        run: bash scripts/verify_release_artifacts.sh dist "$VERSION"

      - name: Publish or repair the GitHub release (idempotent)
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "OpenCraft $TAG" \
              --notes-file "docs/RELEASE-NOTES-$VERSION.md"
            gh release upload "$TAG" dist/opencraft-*.tar.gz dist/opencraft-*.zip --clobber
          else
            gh release create "$TAG" --verify-tag --title "OpenCraft $TAG" \
              --notes-file "docs/RELEASE-NOTES-$VERSION.md" \
              dist/opencraft-*.tar.gz dist/opencraft-*.zip
          fi

      - name: Verify the published release page
        run: bash scripts/verify_release_page.sh "$TAG" "$VERSION"
