[package]
name = "opencraft"
version = "0.2.2"
edition = "2021"
license = "MIT"

[dependencies]
bytemuck = { version = "1.14", features = ["derive"] }
crossbeam-channel = "0.5"
glam = "0.27"
opencraft-core = { path = "crates/opencraft-core" }
opencraft-gfx = { path = "crates/opencraft-gfx" }
opencraft-pathfinding = { path = "crates/opencraft-pathfinding" }
opencraft-physics = { path = "crates/opencraft-physics" }
opencraft-storage = { path = "crates/opencraft-storage" }
rayon = "1.10"
rustc-hash = "1.1"
wgpu = "0.19"
winit = "0.30"
serde = { version = "1", features = ["derive"] }
toml = "1"
glyphon = "=0.5.0"
png = "0.17"
rodio = "=0.23.0"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace]
members = ["crates/*"]
resolver = "2"
